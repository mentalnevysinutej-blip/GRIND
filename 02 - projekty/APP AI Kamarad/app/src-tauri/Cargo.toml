[package]
name = "partak"
version = "0.1.0"
description = "Parťák — AI kamarád na ploše"
edition = "2021"
rust-version = "1.90"

[lib]
name = "partak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
